name: Build and Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DesktopCommandCenter.sln

      - name: Build
        run: dotnet build DesktopCommandCenter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DesktopCommandCenter.sln --configuration Release --no-build --verbosity normal

      - name: Publish portable Windows build
        run: >
          dotnet publish src/DesktopCommandCenter.App/DesktopCommandCenter.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/DesktopCommandCenter

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCommandCenter-win-x64
          path: artifacts/DesktopCommandCenter
          if-no-files-found: error
          retention-days: 14
