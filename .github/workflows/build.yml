name: Build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DesktopCommandCenter.sln

      - name: Build
        run: dotnet build DesktopCommandCenter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DesktopCommandCenter.sln --configuration Release --no-build --verbosity normal