name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/DesktopCommandCenter.App/DesktopCommandCenter.App.csproj"
          $version = $project.Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore DesktopCommandCenter.sln

      - name: Build
        run: dotnet build DesktopCommandCenter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DesktopCommandCenter.sln --configuration Release --no-build --verbosity normal

      - name: Publish Windows x64
        run: >
          dotnet publish src/DesktopCommandCenter.App/DesktopCommandCenter.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/DesktopCommandCenter-win-x64.zip -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists. Skipping."
            exit 0
          }

          gh release create "$env:RELEASE_TAG" `
            "artifacts/DesktopCommandCenter-win-x64.zip" `
            --target "$env:GITHUB_SHA" `
            --title "Desktop Command Center $env:RELEASE_VERSION" `
            --generate-notes
